<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Chamfer That Mesh — Best-guess browser-based post-processing tool to chamfer and fillet STL and 3MF meshes. Uses heuristic triangle CSG; outcomes may be imprecise or broken on complex geometry." />
  <title>Chamfer That Mesh — 3D Edge Beveling Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a1a2e'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='38' fill='%2300d4ff'>⚡</text></svg>" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <div id="edge-hover-badge" class="edge-hover-badge"></div>
      <button id="mobile-panel-toggle" type="button" class="mobile-panel-toggle" aria-expanded="true" aria-controls="sidebar">▼ Hide Controls</button>
      <div id="drop-overlay">
        <div class="drop-message">Drop STL / 3MF file here</div>
      </div>
      <div id="processing-overlay" class="processing-overlay" aria-live="polite" aria-busy="false">
        <div class="processing-card">
          <div class="processing-spinner" aria-hidden="true"></div>
          <div id="processing-title" class="processing-title">Processing Mesh...</div>
          <div id="processing-detail" class="processing-detail">Computing geometry...</div>
          <button id="processing-stop-btn" type="button" class="btn-danger btn-small processing-stop-btn">⏹ Stop Operation (Esc)</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
